  --bg:#07061a;--bg2:#0d0a26;--text:#f2f0ff;--mut:#a29ec8;--line:rgba(255,255,255,.08);
  --surface:rgba(24,20,54,.82);--surface-solid:#17142f;--surface2:rgba(255,255,255,.06);
  --acc:#8d70ff;--acc2:#2bd4ff;--acc-soft:rgba(141,112,255,.17);
  --good:#2fd88a;--good-soft:rgba(47,216,138,.15);--bad:#ff5c7c;--bad-soft:rgba(255,92,124,.15);--warn:#ffb940;--warn-soft:rgba(255,185,64,.14);
  --glass-bg:rgba(38,32,86,.36);--glass-strong:rgba(26,22,62,.7);--glass-brd:rgba(255,255,255,.13);--glass-hi:rgba(255,255,255,.22);
  --glass-shadow:0 14px 44px rgba(0,0,0,.5);--sheet-bg:rgba(28,24,66,.74);
  --chip:rgba(255,255,255,.08);--pill:rgba(255,255,255,.13);--key:rgba(255,255,255,.06);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.32);
  --blob1:rgba(98,62,255,.42);--blob2:rgba(0,150,220,.26);--blob3:rgba(200,40,140,.22);
  color-scheme:dark;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#07061a;--bg2:#0d0a26;--text:#f2f0ff;--mut:#a29ec8;--line:rgba(255,255,255,.08);
  --surface:rgba(24,20,54,.82);--surface-solid:#17142f;--surface2:rgba(255,255,255,.06);
  --acc:#8d70ff;--acc2:#2bd4ff;--acc-soft:rgba(141,112,255,.17);
  --good:#2fd88a;--good-soft:rgba(47,216,138,.15);--bad:#ff5c7c;--bad-soft:rgba(255,92,124,.15);--warn:#ffb940;--warn-soft:rgba(255,185,64,.14);
  --glass-bg:rgba(38,32,86,.36);--glass-strong:rgba(26,22,62,.7);--glass-brd:rgba(255,255,255,.13);--glass-hi:rgba(255,255,255,.22);
  --glass-shadow:0 14px 44px rgba(0,0,0,.5);--sheet-bg:rgba(28,24,66,.74);
  --chip:rgba(255,255,255,.08);--pill:rgba(255,255,255,.13);--key:rgba(255,255,255,.06);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.32);
  --blob1:rgba(98,62,255,.42);--blob2:rgba(0,150,220,.26);--blob3:rgba(200,40,140,.22);
  color-scheme:dark;
}}
html{background:var(--bg)}
body{font-family:var(--font);color:var(--text);min-height:100dvh;line-height:1.85;-webkit-font-smoothing:antialiased;overflow-x:hidden;transition:color .3s}
button{font-family:inherit}
.m{direction:ltr;unicode-bidi:isolate;font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
.mut{color:var(--mut)}.small{font-size:13px}.center{text-align:center}

/* ---------- عمق پس‌زمینه ---------- */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:
 radial-gradient(1100px 760px at 105% -10%,var(--blob1),transparent 60%),
 radial-gradient(900px 700px at -10% 35%,var(--blob2),transparent 58%),
 radial-gradient(900px 700px at 60% 115%,var(--blob3),transparent 58%),
 linear-gradient(180deg,var(--bg),var(--bg2))}
.orb{position:absolute;width:46vmax;height:46vmax;border-radius:50%;background:radial-gradient(circle,var(--blob1),transparent 62%);animation:float 26s ease-in-out infinite alternate;opacity:.8}
.o1{top:-18vmax;left:-10vmax}.o2{bottom:-22vmax;right:-12vmax;background:radial-gradient(circle,var(--blob2),transparent 62%);animation-delay:-9s}
@keyframes float{to{transform:translate(8vmax,7vmax) scale(1.18)}}

/* ---------- Liquid Glass ---------- */
.glass{position:relative;isolation:isolate;background:var(--glass-bg);-webkit-backdrop-filter:blur(24px) saturate(190%);backdrop-filter:blur(24px) saturate(190%);border:1px solid var(--glass-brd);box-shadow:var(--glass-shadow),inset 0 1px 0 var(--glass-hi),inset 0 -1px 1px rgba(255,255,255,.05)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;background:radial-gradient(240px circle at var(--mx,25%) var(--my,-30%),rgba(255,255,255,.55),transparent 62%);mix-blend-mode:soft-light;transition:opacity .4s}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;background:linear-gradient(180deg,rgba(255,255,255,.28),transparent 42%);opacity:.55}

/* ---------- نوار بالا ---------- */
#top{position:sticky;top:max(10px,env(safe-area-inset-top));z-index:50;width:calc(100% - 24px);max-width:956px;margin:10px auto 0;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px 8px 12px;border-radius:24px;view-transition-name:topbar;transition:background .35s,box-shadow .35s}
#top.scrolled{background:var(--glass-strong)}
.brand{display:flex;align-items:center;gap:9px;font-weight:900;font-size:17px;cursor:pointer;background:none;border:none;color:var(--text)}
.logo{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;font-size:20px;font-weight:900;line-height:1;box-shadow:0 6px 16px rgba(109,74,255,.4),inset 0 1px 0 rgba(255,255,255,.45)}
.chips{display:flex;gap:6px;align-items:center}
.chip{display:inline-flex;gap:5px;align-items:center;height:36px;padding:0 12px;border-radius:99px;background:var(--chip);font-weight:800;font-size:14px;border:1px solid var(--line)}
.bump{animation:bump .55s var(--spring)}
@keyframes bump{35%{transform:scale(1.28)}}
.icon-btn{position:relative;overflow:hidden;width:38px;height:38px;flex:none;border-radius:13px;border:1px solid var(--line);background:var(--chip);color:var(--text);font-size:17px;display:grid;place-items:center;cursor:pointer;transition:transform .25s var(--spring)}
.icon-btn:active{transform:scale(.9)}
@media(max-width:560px){.hide-sm{display:none!important}.brand b{display:none}.chip{padding:0 10px;font-size:13px}}

/* ---------- ناوبری شناور ---------- */
#nav{position:fixed;z-index:60;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:2px;padding:6px;border-radius:999px;view-transition-name:nav;transition:transform .55s var(--spring),opacity .3s}
.nav-item{position:relative;z-index:1;width:74px;height:56px;border:none;background:none;border-radius:999px;color:var(--mut);font-size:11px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;transition:color .3s}
.nav-item .ni{font-size:21px;line-height:1.25;transition:transform .45s var(--spring)}
.nav-item[aria-current=true]{color:var(--acc)}
.nav-item[aria-current=true] .ni{transform:translateY(-1px) scale(1.14)}
.pill{position:absolute;top:0;left:0;border-radius:999px;background:var(--pill);box-shadow:0 4px 14px rgba(40,20,120,.14),inset 0 1px 0 var(--glass-hi);transition:transform .55s var(--spring),width .45s var(--spring),height .45s var(--spring);z-index:0}
body.focus #nav{transform:translate(-50%,170%);opacity:0;pointer-events:none}
@media(min-width:1240px){
  #nav{left:auto;right:24px;top:50%;bottom:auto;transform:translateY(-50%);flex-direction:column}
  body.focus #nav{transform:translate(170%,-50%)}
}

main#app{max-width:980px;margin:0 auto;padding:18px 16px calc(118px + env(safe-area-inset-bottom))}
body.focus main#app{padding-bottom:24px}

/* ---------- تایپوگرافی ---------- */
h1{font-size:clamp(30px,6vw,42px);font-weight:900;line-height:1.3;letter-spacing:-.4px}
h2{font-size:21px;font-weight:900;line-height:1.5}
h3{font-size:18px;font-weight:900;line-height:1.55}
.eyebrow{font-size:13px;font-weight:800;color:var(--acc)}

/* ---------- کارت‌ها ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:20px;box-shadow:var(--shadow)}
.hello{padding:12px 4px 18px}.hello p{font-size:16px;margin-top:2px;max-width:560px}

.coach{position:relative;overflow:hidden;margin-bottom:14px;border:1.5px solid transparent;background:linear-gradient(var(--surface-solid),var(--surface-solid)) padding-box,linear-gradient(135deg,var(--acc),var(--acc2),#ff6ec7) border-box}
.coach-glow{position:absolute;inset:-60%;background:conic-gradient(from 0deg,transparent 0 60%,rgba(109,74,255,.13) 75%,transparent 90%);animation:spin 9s linear infinite;pointer-events:none}
@keyframes spin{to{transform:rotate(1turn)}}
.coach-badge{position:relative;display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:900;padding:2px 11px;border-radius:99px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff}
.coach-body{display:flex;gap:14px;align-items:flex-start;margin:12px 0 14px;position:relative}
.coach-emoji{font-size:32px;width:58px;height:58px;flex:none;border-radius:19px;display:grid;place-items:center;background:var(--acc-soft)}
.coach p{color:var(--mut);margin-top:2px}
.coach-actions{display:flex;gap:8px;flex-wrap:wrap;position:relative}
.typing::after{content:"▍";animation:blink 1s steps(1) infinite;color:var(--acc);margin-right:2px}

.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
.stat{padding:16px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;justify-content:space-between}
.stat .big{font-size:26px;font-weight:900;line-height:1.2}
.stat .lbl{font-size:13px;color:var(--mut);font-weight:700}
.ring-wrap{position:relative;width:62px;height:62px}
.ring{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8;stroke-linecap:round}
.ring .bgc{stroke:var(--acc-soft)}
.ring .fgc{transition:stroke-dashoffset 1.3s var(--ease)}
.ring-wrap b{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;font-weight:900}
.mini{height:8px;border-radius:99px;background:var(--acc-soft);overflow:hidden;width:100%}
.mini i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--acc),var(--acc2));width:0;transition:width 1.3s var(--ease)}
@media(max-width:600px){.stat-grid{gap:8px}.stat{padding:12px;border-radius:22px}.stat .big{font-size:19px}.ring-wrap{width:50px;height:50px}.stat .lbl{font-size:11.5px}}

.continue{width:100%;display:flex;align-items:center;gap:14px;text-align:right;color:#fff;cursor:pointer;margin-bottom:24px;position:relative;overflow:hidden;background:linear-gradient(135deg,var(--acc),#9a6bff 55%,var(--acc2));border:none;box-shadow:0 16px 36px rgba(109,74,255,.34);transition:transform .35s var(--spring)}
.continue:hover{transform:translateY(-3px)}.continue:active{transform:scale(.98)}
.continue::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.25) 50%,transparent 70%);transform:translateX(100%);animation:shine 4s ease-in-out infinite}
@keyframes shine{0%,60%{transform:translateX(110%)}100%{transform:translateX(-110%)}}
.continue .ci{font-size:30px;width:60px;height:60px;border-radius:19px;display:grid;place-items:center;background:rgba(255,255,255,.2);flex:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.45)}
.continue .eyebrow{color:rgba(255,255,255,.85)}
.continue h3{color:#fff}
.continue .arrow{margin-inline-start:auto;font-size:20px;width:46px;height:46px;flex:none;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.22);transition:transform .35s var(--spring)}
.continue:hover .arrow{transform:translateX(-5px)}

.section-h{display:flex;justify-content:space-between;align-items:baseline;margin:4px 4px 12px}
.sec-title{grid-column:1/-1;font-size:13px;font-weight:900;color:var(--mut);margin:12px 4px 0;display:flex;align-items:center;gap:8px}
.sec-title::after{content:"";flex:1;height:1px;background:var(--line)}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:10px}
.stage{position:relative;overflow:hidden;text-align:right;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:14px;cursor:pointer;box-shadow:var(--shadow);transition:transform .4s var(--spring),box-shadow .3s;animation:cardIn .6s var(--spring) both;animation-delay:var(--d,0ms)}
.stage:hover{transform:translateY(-4px);box-shadow:0 18px 36px rgba(40,20,120,.14)}
.stage:active{transform:scale(.96)}
.st-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.st-icon{font-size:23px;width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:var(--acc-soft)}
.st-num{font-size:12px;font-weight:900;color:var(--mut)}
.st-title{font-weight:800;font-size:14.5px;line-height:1.6;min-height:46px}
.st-stars{font-size:14px;letter-spacing:2px}
.st-stars span{opacity:.22}.st-stars .on{opacity:1;color:#ffb020}
.st-check{position:absolute;left:12px;bottom:12px;width:22px;height:22px;border-radius:50%;background:var(--good);color:#fff;font-size:12px;display:grid;place-items:center;font-weight:900;box-shadow:0 4px 10px rgba(18,183,106,.4)}
.stage.next{border:2px solid transparent;background:linear-gradient(var(--surface-solid),var(--surface-solid)) padding-box,linear-gradient(135deg,var(--acc),var(--acc2)) border-box;box-shadow:0 0 0 6px var(--acc-soft),var(--shadow)}
.stage.next .st-num{visibility:hidden}
.st-badge{position:absolute;left:10px;top:12px;font-size:11px;font-weight:900;color:#fff;background:linear-gradient(135deg,var(--acc),var(--acc2));padding:1px 10px;border-radius:99px;animation:pulse 2s infinite}
.stage.locked{opacity:.55}.stage.locked .st-icon{filter:grayscale(1)}
@keyframes cardIn{from{opacity:0;transform:translateY(16px) scale(.96)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(109,74,255,.5)}70%,100%{box-shadow:0 0 0 8px rgba(109,74,255,0)}}

details.plan{margin-top:16px}
details.plan summary{list-style:none;font-weight:900;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:16px}
details.plan summary::-webkit-details-marker{display:none}
details.plan summary::after{content:"⌄";font-size:20px;transition:transform .35s var(--spring)}
details.plan[open] summary::after{transform:rotate(180deg)}
.plan ul{list-style:none;margin-top:12px;display:grid;gap:8px}
.plan li{padding:10px 14px;border-radius:16px;background:var(--surface2);animation:cardIn .5s var(--spring) both}
.footer{text-align:center;margin-top:22px;display:grid;gap:10px;justify-items:center}
.linkbtn{background:none;border:none;color:var(--mut);font-size:12px;text-decoration:underline;cursor:pointer}

/* ---------- دکمه‌ها ---------- */
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 22px;border:none;border-radius:16px;font-size:15px;font-weight:800;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--acc),#9a6bff);box-shadow:0 8px 22px rgba(109,74,255,.3),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .3s var(--spring),box-shadow .25s,filter .2s;text-decoration:none;white-space:nowrap}
.btn:hover{transform:translateY(-2px);filter:brightness(1.06)}
.btn:active{transform:scale(.95)}
.btn.ghost,.btn.sec{background:var(--acc-soft);color:var(--acc);box-shadow:none}
.btn.good{background:linear-gradient(135deg,#12b76a,#22d39a);box-shadow:0 8px 22px rgba(18,183,106,.3),inset 0 1px 0 rgba(255,255,255,.35)}
.btn.danger{background:linear-gradient(135deg,#f04467,#ff7a59);box-shadow:0 8px 22px rgba(240,68,103,.28)}
.btn.block{width:100%}.btn.sm{height:38px;padding:0 14px;font-size:13px;border-radius:12px}
.ripple{position:absolute;border-radius:50%;background:currentColor;opacity:.18;transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(1);opacity:0}}

/* ---------- Sheet فضایی ---------- */
.scrim{position:fixed;inset:0;z-index:90;background:rgba(10,6,30,.26);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.sheet{position:fixed;z-index:91;border-radius:32px;padding:22px;width:min(380px,calc(100vw - 24px));max-height:calc(100dvh - 40px);overflow:auto;background:var(--sheet-bg)}
.sheet.bottom{left:12px;right:12px;width:auto;bottom:calc(12px + env(safe-area-inset-bottom))}
.sheet-icon{font-size:40px;width:80px;height:80px;border-radius:26px;display:grid;place-items:center;margin:0 auto 8px;background:var(--acc-soft);box-shadow:inset 0 1px 0 var(--glass-hi)}
.sheet-icon.txt{font-size:24px;width:auto;min-width:80px;padding:0 16px}
.sheet h3{font-size:21px;text-align:center}
.sheet p{text-align:center}
.sheet-stars{text-align:center;font-size:26px;letter-spacing:4px}
.sheet-stars span{opacity:.2}.sheet-stars .on{opacity:1;color:#ffb020}
.meta-row{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:10px 0 12px}
.meta-row span{font-size:12px;font-weight:800;padding:4px 11px;border-radius:99px;background:var(--chip);border:1px solid var(--line)}
.sheet-actions{display:grid;gap:8px;margin-top:14px}
.note{padding:10px 14px;border-radius:16px;font-size:14px;margin:8px 0}.note.warn{background:var(--warn-soft)}
.toast{position:fixed;left:50%;top:calc(80px + env(safe-area-inset-top));transform:translateX(-50%);z-index:120;padding:10px 20px;border-radius:99px;font-weight:800;font-size:14px;animation:toastIn .5s var(--spring);white-space:nowrap}
.toast.out{opacity:0;transform:translate(-50%,-12px);transition:.35s}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-18px) scale(.9)}}

/* ---------- درس ---------- */
.lesson-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.lh-icon{font-size:30px;width:58px;height:58px;border-radius:19px;display:grid;place-items:center;background:var(--acc-soft);flex:none}
.lh-text{flex:1;min-width:0}.lh-text h2{font-size:19px;line-height:1.4}
.lesson{min-height:360px;font-size:17px;padding:24px 22px;touch-action:pan-y;overflow:hidden}
.lesson h3{font-size:22px;margin-bottom:10px;background:linear-gradient(135deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.lesson p{margin:8px 0}
.lesson .key{background:var(--good-soft);border-inline-start:4px solid var(--good);padding:12px 14px;border-radius:16px;margin:12px 0}
.lesson .tip{background:var(--warn-soft);border-inline-start:4px solid var(--warn);padding:12px 14px;border-radius:16px;margin:12px 0}
.lesson-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px}
.sdots{display:flex;gap:6px}
.sdots i{width:8px;height:8px;border-radius:99px;background:var(--acc-soft);transition:width .45s var(--spring),background .3s}
.sdots i.on{width:26px;background:var(--acc)}
.swipe-hint{font-size:12px;color:var(--mut);text-align:center;margin-top:8px}

/* ---------- تصویرسازی درس ---------- */
.groups{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:12px 0}
.grp{background:var(--acc-soft);border:2px dashed var(--acc);border-radius:16px;padding:8px;display:flex;flex-wrap:wrap;gap:5px;max-width:92px;justify-content:center;animation:pop .5s var(--spring) both}
.dot{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff9a9a,#e11d48);display:inline-block;box-shadow:0 2px 4px rgba(225,29,72,.3)}
.dot.b{background:radial-gradient(circle at 35% 35%,#9cc2ff,#2563eb);box-shadow:0 2px 4px rgba(37,99,235,.3)}
.arr{display:inline-grid;gap:5px;padding:12px;background:var(--surface2);border-radius:16px;direction:ltr}
.vizwrap{text-align:center;margin:8px 0}
.dots-row{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;align-items:center;text-align:center}
.fingers{display:flex;gap:6px;justify-content:center;align-items:flex-end;direction:ltr;margin:12px 0;height:80px}
.fingers i{display:block;width:18px;height:64px;background:#fcd9b6;border:2px solid #d9a877;border-radius:10px 10px 4px 4px;position:relative}
.fingers i.fold{height:22px;background:#fca5a5;border-color:var(--bad)}
.fingers i.gap{margin-left:14px}
.fingers i span{position:absolute;bottom:-22px;left:0;right:0;font-size:11px;text-align:center;font-style:normal;color:var(--mut)}
table.area{border-collapse:separate;border-spacing:5px;margin:10px auto;direction:ltr}
table.area th{color:var(--acc);font-size:16px;padding:4px 10px}
table.area td{background:var(--acc-soft);border-radius:12px;padding:10px 16px;font-weight:800;text-align:center;min-width:60px}
.col-grid{display:inline-grid;grid-template-columns:repeat(5,34px);direction:ltr;font-size:26px;font-weight:800;text-align:center;margin:10px auto;line-height:1.4}
.col-grid .c{color:var(--bad);font-size:15px;height:22px}
.col-grid .ln{grid-column:1/-1;border-top:3px solid var(--text);margin:2px 0}
.col-grid .res{color:var(--good)}
.builder label{display:block;font-weight:800;margin:6px 0}
input[type=range]{width:100%;accent-color:var(--acc);height:28px}

/* ---------- تمرین ---------- */
.quiz{max-width:560px;margin:0 auto}
.quiz-bar{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.pbar{flex:1;height:12px;border-radius:99px;background:var(--acc-soft);overflow:hidden}
.pbar i{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,var(--acc2),var(--acc));transition:width .7s var(--spring);box-shadow:0 0 14px rgba(109,74,255,.5)}
.qcount{font-weight:900;font-size:14px;color:var(--mut);min-width:46px;text-align:left}
.qcard{text-align:center;padding:20px 16px}
.q-top{display:flex;gap:6px;justify-content:center;align-items:center;flex-wrap:wrap;font-size:13px;font-weight:800;color:var(--mut)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:900;padding:1px 10px;border-radius:99px;background:var(--acc-soft);color:var(--acc)}
.tag.warn{background:var(--warn-soft);color:#c77700}.tag.fire{background:rgba(255,100,50,.15);color:#f0602a}
.qsub{font-size:18px;font-weight:700;margin-top:6px}
.qtext{font-size:clamp(38px,11vw,58px);font-weight:900;line-height:1.3;margin:6px 0 4px;letter-spacing:-.5px}
.disp{direction:ltr;height:76px;display:flex;align-items:center;justify-content:center;gap:4px;font-size:42px;font-weight:900;border-radius:22px;background:var(--surface2);border:2px solid transparent;margin:8px auto;max-width:300px;color:var(--acc);transition:background .3s,border-color .3s,color .3s,transform .35s var(--spring)}
.caret{width:3px;height:40px;border-radius:3px;background:var(--acc);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.disp.ok{background:var(--good-soft);border-color:var(--good);color:var(--good);transform:scale(1.05)}
.disp.ok .caret,.disp.bad .caret{display:none}
.disp.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);animation:shake .4s}
.disp s{opacity:.5;font-size:28px}.disp .to{font-size:20px;opacity:.6;margin:0 8px}.disp .right{color:var(--good);animation:pop .5s var(--spring)}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
@keyframes pop{from{transform:scale(.8);opacity:0}}
.fb{min-height:6px}
.fb-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 16px;border-radius:99px;font-weight:900;animation:pop .45s var(--spring)}
.fb-chip.good{background:var(--good-soft);color:var(--good)}.fb-chip.bad{background:var(--bad-soft);color:var(--bad)}
.hintbox{background:var(--warn-soft);border-radius:18px;padding:12px 14px;margin-top:10px;text-align:right;line-height:2.15;animation:pop .45s var(--spring)}
.coachtip{background:var(--acc-soft);border-radius:18px;padding:10px 14px;margin-top:8px;text-align:right;font-size:14px;animation:pop .45s var(--spring)}
.fb .btn{margin-top:12px}
.hint-btn{margin-top:6px;border:none;background:none;color:var(--mut);font-weight:800;font-size:14px;cursor:pointer;padding:6px 14px;border-radius:99px;transition:background .2s,color .2s}
.hint-btn:hover{background:var(--acc-soft)}
.hint-btn.nudge{color:var(--acc);background:var(--acc-soft);animation:nudge 1.8s var(--spring) infinite}
@keyframes nudge{0%,100%{transform:none}8%{transform:rotate(-5deg) scale(1.07)}16%{transform:rotate(5deg) scale(1.07)}24%{transform:none}}
.pad{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom));z-index:5;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px;border-radius:30px;margin-top:12px;direction:ltr}
.pad button{position:relative;overflow:hidden;height:56px;border-radius:19px;border:1px solid var(--line);background:var(--key);color:var(--text);font-size:25px;font-weight:800;cursor:pointer;box-shadow:inset 0 1px 0 var(--glass-hi),0 2px 6px rgba(20,10,60,.06);transition:transform .18s var(--spring),background .2s}
.pad button:active{transform:scale(.92)}
.pad .ok{grid-column:span 2;background:linear-gradient(135deg,#12b76a,#22d39a);color:#fff;border:none;font-size:18px}
.pad .bk{color:var(--bad)}
@media(max-height:700px){.pad button{height:48px}.qtext{font-size:36px}.disp{height:60px;font-size:34px}}
.flyxp{position:fixed;z-index:200;font-weight:900;font-size:22px;color:var(--acc);pointer-events:none;text-shadow:0 2px 12px rgba(109,74,255,.45)}

/* ---------- نتیجه ---------- */
.result{text-align:center;padding:30px 20px;max-width:560px;margin:0 auto}
.res-emoji{font-size:64px;animation:pop .7s var(--spring)}
.rstars{font-size:52px;letter-spacing:8px;margin:4px 0}
.rstar{display:inline-block;opacity:.18;animation:starIn .7s var(--spring) both}
.rstar.on{color:#ffb020;opacity:1;text-shadow:0 6px 20px rgba(255,176,32,.5)}
@keyframes starIn{from{transform:scale(0) rotate(-120deg);opacity:0}}
.res-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:18px 0}
.res-stats div{background:var(--surface2);border-radius:18px;padding:12px 6px;animation:cardIn .6s var(--spring) both}
.res-stats b{display:block;font-size:20px;font-weight:900}
.res-stats span{font-size:11px;color:var(--mut);font-weight:700}
@media(max-width:480px){.res-stats{grid-template-columns:1fr 1fr}}
.res-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:6px}

/* ---------- سرعت ---------- */
.timer-ring{position:relative;width:60px;height:60px;flex:none}
.timer-ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:17px;font-weight:900}
.timer-ring.hurry b{color:var(--bad)}.timer-ring.hurry .fgc{stroke:var(--bad)}
.score{font-size:24px;font-weight:900;margin-inline-start:auto}
.bigemoji{font-size:58px;line-height:1.3}

/* ---------- مرور و جدول ---------- */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 14px}
.mode-card{position:relative;overflow:hidden;text-align:right;color:var(--text);border:1px solid var(--line);background:var(--surface);border-radius:26px;padding:18px;cursor:pointer;box-shadow:var(--shadow);transition:transform .4s var(--spring);animation:cardIn .6s var(--spring) both}
.mode-card:hover{transform:translateY(-3px)}.mode-card:active{transform:scale(.97)}
.mode-card .mi{font-size:28px;width:56px;height:56px;border-radius:18px;display:grid;place-items:center;background:var(--acc-soft);margin-bottom:8px}
.mode-card b{display:block;font-size:17px}.mode-card small{color:var(--mut);font-size:13px}
.mode-card[disabled]{opacity:.5;pointer-events:none}
.boxes{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:160px;margin-top:12px}
.boxes .col{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.boxes .barv{width:100%;border-radius:12px 12px 6px 6px;min-height:6px;height:0;transition:height 1.1s var(--spring)}
.boxes b{font-size:13px}.boxes span{font-size:11px;color:var(--mut);font-weight:800;white-space:nowrap}
.fchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.fchip{padding:6px 14px;border-radius:14px;background:var(--bad-soft);font-weight:900;border:1px solid var(--line);color:var(--text);cursor:pointer;font-size:16px;transition:transform .3s var(--spring)}
.fchip:hover{transform:translateY(-2px)}
.tbl{display:grid;grid-template-columns:repeat(11,1fr);gap:4px;direction:ltr}
.tbl div{aspect-ratio:1;display:grid;place-items:center;border-radius:10px;font-weight:800;font-size:clamp(11px,2.7vw,15px);cursor:pointer;transition:transform .3s var(--spring);animation:cellIn .5s var(--spring) both}
.tbl div:hover{transform:scale(1.14);z-index:1}
.tbl .h{background:linear-gradient(135deg,var(--acc),#9a6bff);color:#fff;cursor:default}.tbl .h:hover{transform:none}
@keyframes cellIn{from{opacity:0;transform:scale(.4)}}
.new{background:var(--surface2)}.easy{background:var(--good-soft)}
.b0{background:rgba(240,68,103,.26)}.b1{background:rgba(245,120,60,.26)}.b2{background:rgba(245,190,40,.3)}.b3{background:rgba(160,210,60,.34)}.b4{background:rgba(40,200,110,.4)}.b5{background:var(--good);color:#fff}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;font-size:12px;font-weight:700}
.legend span{padding:3px 10px;border-radius:99px}

.confetti{position:fixed;top:-20px;width:10px;height:14px;z-index:300;border-radius:3px;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* ---------- انتقال صفحه‌ها (View Transitions) ---------- */
::view-transition-old(root){animation:vtOut .2s ease both}
::view-transition-new(root){animation:vtIn .38s cubic-bezier(.2,.8,.2,1) both}
@keyframes vtOut{to{opacity:0;transform:scale(.985)}}
@keyframes vtIn{from{opacity:0;transform:translateY(12px) scale(1.01)}}
::view-transition-group(hero){animation-duration:.5s;animation-timing-function:cubic-bezier(.2,.9,.25,1.1)}
html.vt-theme::view-transition-old(root),html.vt-theme::view-transition-new(root){animation:none;mix-blend-mode:normal}
html.vt-theme #top,html.vt-theme #nav{view-transition-name:none}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
body.focus #top{position:relative;top:0}

</style>
</head>
<body>
<div class="bg" aria-hidden="true"><i class="orb o1"></i><i class="orb o2"></i></div>
<header id="top" class="glass"></header>
<main id="app"></main>
<nav id="nav" class="glass" aria-label="منوی اصلی"></nav>
<div id="layer"></div>
<script>
/* ============ ابزارها ============ */
const FA='۰۱۲۳۴۵۶۷۸۹';
const fa=x=>String(x).replace(/\d/g,d=>FA[d]).replace(/\./g,'٫').replace(/-/g,'−').replace(/\?/g,'؟');
const M=s=>`<span class="m">${fa(s)}</span>`;
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const range=(a,b)=>Array.from({length:b-a+1},(_,i)=>a+i);
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const app=$('#app');
const SPRING='cubic-bezier(.2,.9,.25,1.15)';

/* ============ ذخیره پیشرفت ============ */
const KEY='zarb-hero-v1';
let store=null;try{store=window.localStorage;store.getItem('t')}catch(e){store=null}
let S={xp:0,stars:{},lt:{},tm:{},best:0,mute:false,theme:'auto',lastDay:'',log:[]};
try{const d=store&&JSON.parse(store.getItem(KEY));if(d)S=Object.assign(S,d)}catch(e){}
S.tm=S.tm||{};S.log=S.log||[];
function save(){try{store&&store.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* ============ صدا و لرزش ============ */
let actx=null;
function tone(fs,dur=.12,type='sine'){if(S.mute)return;try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();const t=actx.currentTime;fs.forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.16,t+i*dur);g.gain.exponentialRampToValueAtTime(.001,t+(i+1)*dur);o.connect(g);g.connect(actx.destination);o.start(t+i*dur);o.stop(t+(i+1)*dur+.03)})}catch(e){}}
const buzz=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
const sGood=()=>{tone([660,880],.09);buzz(12)};
const sBad=()=>{tone([260,200],.15,'triangle');buzz([30,40,30])};
const sWin=()=>tone([523,659,784,1046],.12);
const sTap=()=>tone([420],.03,'sine');

function confetti(){if(RM)return;const c=['#6d4aff','#12b76a','#ffb020','#f04467','#00b3ff','#ff6ec7'];for(let i=0;i<80;i++){const d=document.createElement('div');d.className='confetti';d.style.left=Math.random()*100+'vw';d.style.background=pick(c);d.style.animationDuration=(1.8+Math.random()*1.8)+'s';d.style.animationDelay=(Math.random()*.5)+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),4300)}}
const praise=['آفرین! 🎉','عالی بود! 🌟','دمت گرم! 💪','ایول! 🔥','باریکلا! 👏','درسته! ✨','نابغه‌ای! 🧠','همینه! 🚀'];

/* ============ تصویرسازی ============ */
function groupsViz(a,b){let h='<div class="groups">';for(let i=0;i<a;i++){h+=`<div class="grp" style="animation-delay:${i*70}ms">`+'<i class="dot"></i>'.repeat(b)+'</div>'}return h+'</div>'}
function arrayViz(r,c,blue){return `<div class="arr" style="grid-template-columns:repeat(${c},16px)">`+`<i class="dot${blue?' b':''}"></i>`.repeat(r*c)+'</div>'}
function fingersViz(k){let h='<div class="fingers">';for(let i=1;i<=10;i++){h+=`<i class="${i===k?'fold':''}${i===6?' gap':''}"><span>${fa(i)}</span></i>`}return h+'</div>'}
function areaTable(cols,rows){let h='<table class="area"><tr><th>×</th>'+cols.map(c=>`<th>${fa(c)}</th>`).join('')+'</tr>';rows.forEach(r=>{h+=`<tr><th>${fa(r)}</th>`+cols.map(c=>`<td>${fa(r*c)}</td>`).join('')+'</tr>'});return h+'</table>'}

/* ============ راهبرد (ترفند) برای هر ضرب ============ */
const PRI=[0,1,10,2,5,4,9,3,6,8,7];
function stratM(a,b){const ia=PRI.indexOf(a),ib=PRI.indexOf(b);if(ia<0&&ib<0)return null;return(ib>=0&&(ia<0||ib<=ia))?b:a}
function strat(a,b){
  const ia=PRI.indexOf(a),ib=PRI.indexOf(b);
  if(ia<0&&ib<0)return M(`${a} × ${b} = ${a*b}`);
  let m,n,sw=false;
  if(ib>=0&&(ia<0||ib<=ia)){m=b;n=a}else{m=a;n=b;sw=true}
  let s='';
  switch(m){
    case 0:s=`هر عددی ضرب در صفر میشه صفر ← ${M(`${n} × 0 = 0`)}`;break;
    case 1:s=`هر عددی ضرب در یک میشه خودش ← ${M(`${n} × 1 = ${n}`)}`;break;
    case 10:s=`ضرب در ${M('10')} یعنی یه صفر بذار سمت راستش ← ${M(`${n} × 10 = ${n*10}`)}`;break;
    case 2:s=`ضرب در ${M('2')} یعنی دو برابر ← ${M(`${n} + ${n} = ${2*n}`)}`;break;
    case 5:s=`ضرب در ${M('5')} = نصفِ ضرب در ${M('10')} ← ${M(`${n} × 10 = ${10*n}`)} و نصفش میشه ${M(5*n)}`;break;
    case 4:s=`ضرب در ${M('4')} = دوبار دو برابر ← ${M(`${n} → ${2*n} → ${4*n}`)}`;break;
    case 9:s=`ضرب در ${M('9')} = ضرب در ${M('10')} منهای یکی ← ${M(`${10*n} − ${n} = ${9*n}`)}`;break;
    case 3:s=`ضرب در ${M('3')} = دو برابر به‌علاوه یکی ← ${M(`${2*n} + ${n} = ${3*n}`)}`;break;
    case 6:s=`ضرب در ${M('6')} = ضرب در ${M('5')} به‌علاوه یکی ← ${M(`${5*n} + ${n} = ${6*n}`)}`;break;
    case 8:s=`ضرب در ${M('8')} = سه‌بار دو برابر ← ${M(`${n} → ${2*n} → ${4*n} → ${8*n}`)}`;break;
    case 7:s=`ضرب در ${M('7')} = ضرب در ${M('5')} به‌علاوه ضرب در ${M('2')} ← ${M(`${5*n} + ${2*n} = ${7*n}`)}`;break;
  }
  if(sw&&a!==b)s=`🔄 جابه‌جا کن: ${M(`${a} × ${b}`)} همون ${M(`${b} × ${a}`)} است.<br>`+s;
  return s;
}

/* ============ جعبه لایتنر (تکرار با فاصله) ============ */
const fkey=(a,b)=>a<b?`${a}x${b}`:`${b}x${a}`;
const isCore=(a,b)=>a>=2&&a<=9&&b>=2&&b<=9;
function ltBox(a,b){return S.lt[fkey(a,b)]}
function ltUpdate(a,b,ok,ms){if(!isCore(a,b))return;const k=fkey(a,b);let v=S.lt[k]||0;if(!ok)v=0;else if(ms<7000)v=Math.min(5,v+1);S.lt[k]=v;if(ok)S.tm[k]=S.tm[k]?Math.round(S.tm[k]*.6+ms*.4):ms}
function coreFacts(){const f=[];for(let a=2;a<=9;a++)for(let b=a;b<=9;b++)f.push([a,b]);return f}
function mastered(){return coreFacts().filter(([a,b])=>(ltBox(a,b)||0)>=3).length}
let lastFact='';
function pickFact(){const f=coreFacts();let tot=0;const w=f.map(([a,b])=>{const bx=ltBox(a,b);const x=bx===undefined?16:Math.pow(6-bx,2);tot+=x;return x});
  for(let t=0;t<10;t++){let r=Math.random()*tot,i=0;while(r>w[i]){r-=w[i];i++}const [a,b]=f[Math.min(i,f.length-1)];if(fkey(a,b)!==lastFact||t===9){lastFact=fkey(a,b);return Math.random()<.5?[a,b]:[b,a]}}}
function weakFacts(n=4){return coreFacts().filter(([a,b])=>{const x=ltBox(a,b);return x!==undefined&&x<=1}).sort((p,q)=>(ltBox(...p)-ltBox(...q))||((S.tm[fkey(...q)]||9e9)-(S.tm[fkey(...p)]||9e9))).slice(0,n)}

/* ============ سازنده سوال ============ */
function factQ(a,b,extra){return Object.assign({text:M(`${a} × ${b} = ?`),ans:a*b,hint:strat(a,b),fact:[a,b]},extra||{})}
function tableGen(m){return()=>{const n=rnd(2,10);return Math.random()<.5?factQ(n,m):factQ(m,n)}}
function tableDeck(m){const ns=shuffle(range(2,10)).concat([pick([0,1,rnd(2,10)])]);return shuffle(ns).map(n=>Math.random()<.5?factQ(n,m):factQ(m,n))}
const fmtN=x=>x<0?`(${x})`:`${x}`;
function decStr(i,d){return d===0?String(i):(i/Math.pow(10,d)).toFixed(d)}

/* ============ مراحل ============ */
const STAGES=[
/* 1 */{id:'s1',icon:'🍎',title:'ضرب یعنی چی؟',sec:'بخش ۱: پایه‌ها',
 lesson:[
  `<h3>ضرب = جمعِ تکراریِ سریع ⚡</h3><p>فرض کن ${M(3)} تا بشقاب داری و تو هر بشقاب ${M(4)} تا سیب هست:</p>${groupsViz(3,4)}<p>می‌تونی بشمری: ${M('4 + 4 + 4 = 12')}</p><div class="key">به زبان ضرب می‌نویسیم: ${M('3 × 4 = 12')}<br>یعنی «${M(3)} تا گروهِ ${M(4)}تایی». علامت ${M('×')} رو «ضربدر» می‌خونیم.</div>`,
  {html:`<h3>آرایه: ردیف × ستون 🟦</h3><p>اگه چیزها رو مرتب توی ردیف و ستون بچینیم، تعداد کل = <b>تعداد ردیف × تعداد ستون</b>. خودت امتحان کن! اسلایدرها رو تکون بده:</p><div class="builder"><label>ردیف‌ها: <span id="brv"></span></label><input type="range" min="1" max="10" value="3" id="br"><label>ستون‌ها: <span id="bcv"></span></label><input type="range" min="1" max="10" value="4" id="bc"><div class="vizwrap" id="bviz"></div><div class="center" id="beq" style="font-size:22px"></div></div>`,
   mount(){const br=document.getElementById('br'),bc=document.getElementById('bc');const up=()=>{const r=+br.value,c=+bc.value;document.getElementById('brv').innerHTML=M(r);document.getElementById('bcv').innerHTML=M(c);document.getElementById('bviz').innerHTML=arrayViz(r,c);document.getElementById('beq').innerHTML=M(`${r} × ${c} = ${r*c}`)+'<br><small style="font-size:15px;color:#7b7497">'+M(Array(r).fill(c).join(' + ')+` = ${r*c}`)+'</small>'};br.oninput=up;bc.oninput=up;up()}},
  `<h3>چرا ضرب مهمه؟ 🤔</h3><p>تصور کن ${M(8)} تا جعبه داری و تو هر کدوم ${M(7)} تا مداد. جمع کردن ${M('7+7+7+7+7+7+7+7')} طول می‌کشه، ولی اگه بدونی ${M('8 × 7 = 56')} یه لحظه‌ای جواب رو داری!</p><div class="tip">🎮 تو تمرین این مرحله گروه‌ها رو می‌بینی. اگه لازم شد بشمار، هیچ اشکالی نداره! هدف اینه که <b>معنی</b> ضرب رو بفهمی.</div>`

function applyTheme(){const h=document.documentElement;if(S.theme==='auto')h.removeAttribute('data-theme');else h.setAttribute('data-theme',S.theme);const mt=$('meta[name=theme-color]');if(mt)mt.content=isDark()?'#07061a':'#eef0fb'}
try{darkMQ.addEventListener('change',applyTheme)}catch(e){}
function cycleTheme(ev){
  const nt=THEMES[(THEMES.indexOf(S.theme)+1)%3];
  const apply=()=>{S.theme=nt;save();applyTheme();updateHeader()};
  if(document.startViewTransition&&!RM&&ev){
    const r=ev.currentTarget.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2,rad=Math.hypot(Math.max(x,innerWidth-x),Math.max(y,innerHeight-y));

    vt.finished.finally(()=>document.documentElement.classList.remove('vt-theme'));

/* ============ Sheet فضایی (از خودِ دکمه باز میشه) ============ */
let sheetState=null;
function openSheet(origin,html){
  closeSheet(true);
  const layer=$('#layer'),back=document.createElement('div'),sh=document.createElement('div');
  back.className='scrim';sh.className='sheet glass';sh.innerHTML=html;sh.setAttribute('role','dialog');
  layer.append(back,sh);
  const r=origin&&origin.getBoundingClientRect?origin.getBoundingClientRect():null;
  if(innerWidth<640||!r){sh.classList.add('bottom')}
  else{const w=sh.offsetWidth,h=sh.offsetHeight;sh.style.left=Math.min(Math.max(r.left+r.width/2-w/2,12),innerWidth-w-12)+'px';sh.style.top=Math.min(Math.max(r.top+r.height/2-h/2,80),innerHeight-h-12)+'px'}
  const sr=sh.getBoundingClientRect();
  if(!RM){
    let from='translateY(40px) scale(.96)';
    if(r){const dx=(r.left+r.width/2)-(sr.left+sr.width/2),dy=(r.top+r.height/2)-(sr.top+sr.height/2),s=Math.max(.12,Math.min(1,r.width/sr.width));from=`translate(${dx}px,${dy}px) scale(${s})`}
    sh.animate([{transform:from,opacity:0,borderRadius:'22px'},{transform:'none',opacity:1,borderRadius:'32px'}],{duration:480,easing:SPRING});
    back.animate([{opacity:0},{opacity:1}],{duration:260});
  }
  back.onclick=()=>closeSheet();
  sheetState={sh,back,origin:r};
  return sh;
}
function closeSheet(instant){
  if(!sheetState)return;const{sh,back,origin}=sheetState;sheetState=null;
  if(instant||RM){sh.remove();back.remove();return}
  const sr=sh.getBoundingClientRect();let to='translateY(40px) scale(.96)';
  if(origin){const dx=(origin.left+origin.width/2)-(sr.left+sr.width/2),dy=(origin.top+origin.height/2)-(sr.top+sr.height/2),s=Math.max(.12,Math.min(1,origin.width/sr.width));to=`translate(${dx}px,${dy}px) scale(${s})`}
  sh.animate([{transform:'none',opacity:1},{transform:to,opacity:0}],{duration:300,easing:'cubic-bezier(.4,0,.6,1)'}).onfinish=()=>sh.remove();
  back.animate([{opacity:1},{opacity:0}],{duration:280}).onfinish=()=>back.remove();
}

let pad=null;
function padHTML(){const k=[['7','7'],['8','8'],['9','9'],['4','4'],['5','5'],['6','6'],['1','1'],['2','2'],['3','3'],['-','−'],['0','0'],['.','٫']];return k.map(([v,l])=>`<button data-k="${v}" aria-label="${v==='.'?'ممیز':l}">${v==='.'?'<b style="font-size:34px;line-height:1">.</b>':fa(l)}</button>`).join('')+'<button class="bk" data-k="back" aria-label="پاک کردن">⌫</button><button class="ok" data-k="ok">✔ ثبت</button>'}
function bindPad(){$$('.pad button').forEach(b=>b.onclick=()=>padPress(b.dataset.k))}
function updateDisp(){const d=$('#disp');if(d)d.innerHTML=(pad&&pad.buf?`<span>${fa(pad.buf)}</span>`:'')+'<span class="caret"></span>'}
function padPress(k){if(!pad)return;if(pad.locked){if(k==='ok'&&pad.cont)pad.cont();return}
  if(k==='back')pad.buf=pad.buf.slice(0,-1);
  else if(k==='ok'){pad.submit();return}
  else if(k==='-')pad.buf=pad.buf.startsWith('-')?pad.buf.slice(1):'-'+pad.buf;
  else if(k==='.'){if(!pad.buf.includes('.'))pad.buf+=(pad.buf===''||pad.buf==='-')?'0.':'.'}
  else if(pad.buf.replace(/[-.]/g,'').length<9)pad.buf+=k;
  buzz(6);updateDisp()}
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&sheetState){closeSheet();return}
  if(!pad||sheetState)return;let k=e.key;const i='۰۱۲۳۴۵۶۷۸۹'.indexOf(k),j='٠١٢٣٤٥٦٧٨٩'.indexOf(k);if(i>=0)k=String(i);if(j>=0)k=String(j);
  if(/^[0-9]$/.test(k))padPress(k);else if(k==='Enter'){e.preventDefault();padPress('ok')}else if(k==='Backspace')padPress('back');else if(k==='-')padPress('-');else if(k==='.'||k==='٫'||k==='/')padPress('.')});

function flyXP(from,amount){

  el.className='flyxp';el.textContent='+'+fa(amount);el.style.left=(a.left+a.width/2-18)+'px';el.style.top=(a.top+4)+'px';document.body.appendChild(el);
  const dx=b.left+b.width/2-(a.left+a.width/2),dy=b.top-a.top;

const TIP_STAGE={2:3,5:4,4:5,9:6,3:7,6:8,8:9,7:10};

function nextQ(first){
  clearTimeout(Q.ht);if(!Q.queue.length)return finish();

function checkAns(){
  if(pad.buf===''||pad.buf==='-'||pad.buf==='.')return;
  const c=Q.cur,v=parseFloat(pad.buf),ok=Math.abs(v-c.ans)<1e-9,ms=Date.now()-Q.t0;clearTimeout(Q.ht);
  if(c.fact)ltUpdate(c.fact[0],c.fact[1],ok,ms);
  pad.locked=true;const d=$('#disp'),fb=$('#fb');$('#hbtn').style.display='none';
  if(!c.retry)Q.done++;
  $('#pfill').style.width=(Q.done/Q.total*100)+'%';$('#qcount').textContent=`${fa(Q.done)}/${fa(Q.total)}`;
  if(ok){
    sGood();Q.streak++;Q.maxStreak=Math.max(Q.maxStreak,Q.streak);if(!c.retry)Q.first++;
    const g=c.retry?3:(Q.hint?5:10)+(Q.streak>=5?2:0);Q.xp+=g;S.xp+=g;save();
    d.classList.add('ok');fb.innerHTML=`<span class="fb-chip good">${pick(praise)}${ms<4000&&!Q.hint?' ⚡ سریع!':''}</span>`;
    flyXP(d,g);window._nq=setTimeout(()=>nextQ(),900);
  }else{

    fb.innerHTML=`<span class="fb-chip bad">نزدیک بود! جواب درست: ${M(c.ans)}</span><div class="hintbox">💡 ${c.hint}</div>${tip}<button class="btn block" id="cbtn">فهمیدم، ادامه ←</button><div class="mut small" style="margin-top:6px">این سوال آخر تمرین دوباره میاد 🔁</div>`;

}

  go(()=>{setTab(null);cur='speedRun';
    app.innerHTML=`<div class="quiz"><div class="quiz-bar"><button class="icon-btn" id="qx" aria-label="خروج">✕</button><div class="timer-ring" id="tring"><svg class="ring" viewBox="0 0 80 80"><defs><linearGradient id="gt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--acc)"/><stop offset="1" stop-color="var(--acc2)"/></linearGradient></defs><circle class="bgc" cx="40" cy="40" r="34"/><circle class="fgc" id="tfg" cx="40" cy="40" r="34" stroke="url(#gt)" style="stroke-dasharray:${TC};stroke-dashoffset:0;transition:none"/></svg><b id="tm">${fa(60)}</b></div><div class="score">✅ <span id="sc">${fa(0)}</span></div></div>
    <div class="card qcard"><div class="q-top">⚡ مسابقه سرعت</div><div class="qtext" id="sq"></div><div class="disp" id="disp"></div><div class="fb" id="fb"></div></div><div class="pad glass">${padHTML()}</div></div>`;
    bindPad();
    $('#qx').onclick=e=>askConfirm({origin:e.currentTarget,icon:'🏳️',title:'مسابقه رو تموم می‌کنی؟',yes:'آره، خروج',danger:1,onYes:()=>{clearInterval(window._spT);SP=null;pad=null;speedIntro()}});
    speedQ();
    clearInterval(window._spT);window._spT=setInterval(()=>{if(!SP)return clearInterval(window._spT);const rem=Math.max(0,(SP.end-Date.now())/1000),f=$('#tfg'),t=$('#tm');if(f)f.style.strokeDashoffset=TC*(1-rem/60);if(t)t.textContent=fa(Math.ceil(rem));if(rem<=10)$('#tring')?.classList.add('hurry');if(rem<=0){clearInterval(window._spT);speedEnd()}},100);
  })}
function speedQ(){if(!SP||Date.now()>=SP.end)return;const[a,b]=pickFact();SP.t0=Date.now();const sq=$('#sq');if(!sq)return;sq.innerHTML=M(`${a} × ${b} = ?`);$('#fb').innerHTML='';const d=$('#disp');d.className='disp';
  if(!RM)sq.animate([{opacity:0,transform:'scale(.85)'},{opacity:1,transform:'none'}],{duration:300,easing:SPRING});
  pad={buf:'',locked:false,cont:null,submit(){if(pad.buf===''||pad.buf==='-')return;const ok=parseInt(pad.buf,10)===a*b;ltUpdate(a,b,ok,Date.now()-SP.t0);pad.locked=true;
    if(ok){SP.score++;sGood();d.classList.add('ok');const sc=$('#sc');sc.textContent=fa(SP.score);sc.parentElement.classList.remove('bump');void sc.offsetWidth;sc.parentElement.classList.add('bump');setTimeout(speedQ,230)}
    else{SP.wrong++;sBad();d.classList.add('bad');$('#fb').innerHTML=`<span class="fb-chip bad">${M(`${a} × ${b} = ${a*b}`)}</span>`;setTimeout(speedQ,1300)}}};
  updateDisp()}
function speedEnd(){pad=null;if(!SP)return;const sc=SP.score,wr=SP.wrong,rec=sc>S.best;if(rec)S.best=sc;const g=sc*4;S.xp+=g;S.lastDay=today();save();SP=null;
  go(()=>{setTab(null);cur='result';
    app.innerHTML=`<div class="card result"><div class="res-emoji">${rec?'🏆':'⏱️'}</div><h1 style="font-size:28px">${rec?'رکورد جدید!':'وقت تموم شد!'}</h1><p class="mut">${sc>=30?'فوق‌العاده! جدول ضرب رو کاملاً مسلطی.':sc>=20?'خیلی خوبه! چند دور دیگه و به ۳۰ می‌رسی.':'هر دور سریع‌تر میشی. ادامه بده!'}</p>
    <div class="res-stats"><div><b>${fa(sc)}</b><span>درست</span></div><div><b>${fa(wr)}</b><span>اشتباه</span></div><div><b>${fa(S.best)}</b><span>رکورد</span></div><div><b>+${fa(g)}</b><span>XP</span></div></div>
    <div class="res-actions"><button class="btn good" id="r1">دوباره 🔁</button><button class="btn ghost" id="r2">🗺️ نقشه</button></div></div>`;
    $('#r1').onclick=speedStart;$('#r2').onclick=()=>home();updateHeader()});
  if(rec&&sc>0){setTimeout(sWin,300);setTimeout(confetti,350)}}

/* ============ مرور هوشمند (هاب) ============ */
function reviewHub(){go(()=>{setTab('review');cur='review';
  const weak=weakFacts(8),f=coreFacts(),cnt=[f.filter(x=>ltBox(...x)===undefined).length,...[0,1,2,3,4,5].map(b=>f.filter(x=>ltBox(...x)===b).length)],mx=Math.max(1,...cnt);
  const cols=['var(--surface2)','rgba(240,68,103,.55)','rgba(245,120,60,.55)','rgba(245,190,40,.6)','rgba(160,210,60,.65)','rgba(40,200,110,.7)','var(--good)'],labels=['جدید','جعبه ۰','جعبه ۱','جعبه ۲','جعبه ۳','جعبه ۴','جعبه ۵'];
  app.innerHTML=`<section class="hello"><div class="eyebrow">تکرار با فاصله 🧠</div><h1>مرور هوشمند</h1><p class="mut">مغز چیزی رو که درست قبل از فراموش شدن مرور کنه، برای همیشه نگه می‌داره. جعبه‌ی لایتنر دقیقاً همین کار رو می‌کنه: ضرب‌های سخت رو زیاد می‌پرسه و ضرب‌های آسون رو کم.</p></section>
  <div class="modes"><button class="mode-card" id="m1"><div class="mi">🧠</div><b>مرور هوشمند</b><small>${fa(15)} سوال — سخت‌ترها بیشتر</small></button><button class="mode-card" id="m2" ${weak.length?'':'disabled'} style="animation-delay:.06s"><div class="mi">🎯</div><b>ضرب‌های سختم</b><small>${weak.length?`${fa(weak.length)} ضرب نیاز به تمرین داره`:'فعلاً ضرب سختی نداری 🎉'}</small></button></div>
  <section class="card"><h3>جعبه‌های لایتنر تو</h3><p class="mut small">هر بار درست و سریع جواب بدی، اون ضرب یه جعبه جلو میره. اگه اشتباه بزنی، برمی‌گرده جعبه‌ی صفر. از جعبه‌ی ۳ به بعد یعنی مسلطی 💪</p>
  <div class="boxes">${cnt.map((c,i)=>`<div class="col"><b>${fa(c)}</b><div class="barv" style="background:${cols[i]}" data-h="${Math.max(4,c/mx*100)}%"></div><span>${labels[i]}</span></div>`).join('')}</div></section>
  ${weak.length?`<section class="card" style="margin-top:14px"><h3>نیاز به تمرین</h3><p class="mut small">روی هر کدوم بزن تا ترفندش رو ببینی 👇</p><div class="fchips">${weak.map(([a,b])=>`<button class="fchip" data-a="${a}" data-b="${b}">${M(`${a}×${b}`)}</button>`).join('')}</div></section>`:''}`;
  $('#m1').onclick=()=>startReview();if(weak.length)$('#m2').onclick=()=>startFocus(weak);
  $$('.fchip').forEach(b=>b.onclick=()=>factSheet(+b.dataset.a,+b.dataset.b,b));
  animateMeters()})}
function factSheet(a,b,origin){
  const core=isCore(a,b),bx=ltBox(a,b),tm=S.tm[fkey(a,b)];
  openSheet(origin,`<div class="sheet-icon txt">${M(`${a}×${b}`)}</div><h3>${M(`${a} × ${b} = ${a*b}`)}</h3><div class="hintbox">💡 ${strat(a,b)}</div>${core?`<div class="meta-row"><span>📦 ${bx===undefined?'هنوز تمرین نشده':'جعبه‌ی '+fa(bx)}</span>${tm?`<span>⏱️ میانگین ${fa((tm/1000).toFixed(1))} ثانیه</span>`:''}</div>`:''}<div class="sheet-actions">${core?`<button class="btn block" id="fs1">🎯 تمرین این ضرب</button>`:''}<button class="btn ghost block" id="fs2">فهمیدم</button></div>`);
  if(core)$('#fs1').onclick=()=>{const rel=[[a,b]];range(2,9).filter(x=>x!==b).sort(()=>Math.random()-.5).slice(0,3).forEach(x=>rel.push([a,x]));startFocus(rel)};
  $('#fs2').onclick=()=>closeSheet();
}

/* ============ جدول من ============ */
function tableScreen(){go(()=>{setTab('table');cur='table';
  let h='<div class="h">×</div>';for(let c=1;c<=10;c++)h+=`<div class="h" style="animation-delay:${c*15}ms">${fa(c)}</div>`;
  for(let r=1;r<=10;r++){h+=`<div class="h" style="animation-delay:${r*15}ms">${fa(r)}</div>`;for(let c=1;c<=10;c++){let cls='easy';if(isCore(r,c)){const b=ltBox(r,c);cls=b===undefined?'new':'b'+b}h+=`<div class="${cls}" data-r="${r}" data-c="${c}" style="animation-delay:${(r+c)*18}ms">${fa(r*c)}</div>`}}
  app.innerHTML=`<section class="hello"><div class="eyebrow">نقشه‌ی حافظه‌ی تو 📊</div><h1>جدول ضرب من</h1><p class="mut">رنگ هر خونه نشون میده چقدر بلدیش. جدول نسبت به قطرش قرینه‌ست (جابه‌جایی!). روی هر خونه بزن تا ترفندش رو ببینی.</p></section>
  <div class="card"><div class="tbl">${h}</div><div class="legend"><span class="new">هنوز تمرین نشده</span><span class="b0">نیاز به تمرین</span><span class="b2">در حال یادگیری</span><span class="b3">خوب</span><span class="b5">مسلط 💪</span><span class="easy">آسون (×۱، ×۱۰)</span></div></div>`;
  $$('.tbl div[data-r]').forEach(el=>el.onclick=()=>factSheet(+el.dataset.r,+el.dataset.c,el))})}

const TABS=[['map','🗺️','مراحل',home],['review','🧠','مرور',reviewHub],['speed','⚡','سرعت',speedIntro],['table','📊','جدول',tableScreen]];

/* دکمه‌ی برگشت اندروید */
window.onAndroidBack=function(){
  if(sheetState){closeSheet();return 'handled'}
  if(cur==='home')return 'exit';
  if(cur==='quiz'||cur==='speedRun'){const x=$('#qx');if(x)x.click();return 'handled'}
  home();return 'handled';
};

/* ============ شروع ============ */
applyTheme();renderChrome();setTab('map');renderHome();
requestAnimationFrame(movePill);setTimeout(movePill,300);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(movePill);

</script>
</body>
</html>
